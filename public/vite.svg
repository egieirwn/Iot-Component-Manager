<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="48" height="48" rx="12" fill="url(#grad)" />
  
  <!-- IoT Microchip Body -->
  <rect x="15" y="15" width="18" height="18" rx="4" fill="#FFFFFF" />
  
  <!-- Chip Internal Core -->
  <rect x="19" y="19" width="10" height="10" rx="2" fill="#2563EB" />
  
  <!-- Pins / Traces -->
  <!-- Top -->
  <rect x="19" y="9" width="3" height="4" rx="1.5" fill="#E0E7FF" />
  <rect x="26" y="9" width="3" height="4" rx="1.5" fill="#E0E7FF" />
  <!-- Bottom -->
  <rect x="19" y="35" width="3" height="4" rx="1.5" fill="#E0E7FF" />
  <rect x="26" y="35" width="3" height="4" rx="1.5" fill="#E0E7FF" />
  <!-- Left -->
  <rect x="9" y="19" width="4" height="3" rx="1.5" fill="#E0E7FF" />
  <rect x="9" y="26" width="4" height="3" rx="1.5" fill="#E0E7FF" />
  <!-- Right -->
  <rect x="35" y="19" width="4" height="3" rx="1.5" fill="#E0E7FF" />
  <rect x="35" y="26" width="4" height="3" rx="1.5" fill="#E0E7FF" />
  
  <!-- IoT Connection Dot / Signal -->
  <circle cx="37" cy="11" r="3" fill="#67E8F9" />
</svg>

