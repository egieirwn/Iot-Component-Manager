<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atur ulang kata sandi - Campus IoT Universitas</title>
</head>
<body>
  <header>
    <p><strong>U</strong> <strong>Campus IoT - Universitas</strong> Inventaris Laboratorium</p>
  </header>

  <main>
    <h1>Atur ulang kata sandi</h1>
    <p>Masukkan email kampus Universitas untuk menerima tautan reset yang aman.</p>
    <form action="reset-email-sent.html" method="get">
      <p>
        <label for="email">Email kampus</label><br>
        <input id="email" type="email" autocomplete="email" pattern=".+@un\.ac\.id" title="Gunakan email kampus yang berakhiran @un.ac.id." required>
      </p>
      <p><button type="submit">Kirim tautan reset</button></p>
    </form>
    <p><a href="login.html">Kembali ke halaman masuk</a></p>
  </main>
</body>
</html>
